name: Python smoke tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CLI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "streamlink>=8.6.2,<9" "requests>=2.31,<3"
      - name: Syntax check all application entrypoints
        run: |
          python -m py_compile twitch_auto_recorder.py twitch_auto_recorder_cli.py tar_cli_multi.py function/recording_service.py function/twitch_api.py function/update.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify documented Streamlink CLI switches
        run: |
          streamlink --help > /tmp/streamlink-help.txt
          for flag in --http-timeout --stream-timeout --stream-segment-timeout --stream-segment-attempts --retry-streams --retry-max --retry-open --skip; do
            grep -Fq -- "$flag" /tmp/streamlink-help.txt
          done
